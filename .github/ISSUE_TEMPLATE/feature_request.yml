name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please lead with the problem you're trying to solve — it helps us evaluate the proposal.
  - type: textarea
    id: problem
    attributes:
      label: Problem you're trying to solve
      description: What use case or pain point motivates this request?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why they don't fit.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — links, prior art, mockups.
  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
